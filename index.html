<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzen</title>
  <meta name="description" content="Private Finanz-App">
  <meta name="theme-color" content="#f5f6f8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Setzt Hell/Dunkel sofort, bevor die Seite gezeichnet wird (kein Aufblitzen) -->
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="kopf">
    <div class="kopf-innen">
      <div class="logo">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>Finanzen</span>
      </div>

      <nav class="nav" aria-label="Hauptnavigation">
        <a href="#uebersicht" data-tab="uebersicht">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Übersicht</span>
        </a>
        <a href="#buchungen" data-tab="buchungen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
          <span>Alle Buchungen</span>
        </a>
        <a href="#annahmen" data-tab="annahmen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span>Annahmen</span>
        </a>
        <a href="#stammdaten" data-tab="stammdaten">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          <span>Stammdaten</span>
        </a>
      </nav>

      <button type="button" id="theme-umschalter" class="icon-knopf" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel umschalten">
        <svg class="icon-mond" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sonne" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="inhalt" tabindex="-1">
    <p class="laden">Wird geladen …</p>
  </main>

  <button type="button" id="neue-buchung" class="fab" aria-label="Neue Buchung erfassen" title="Neue Buchung erfassen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="toast"class="toast" role="status" aria-live="polite"></div>

  <noscript>Diese App benötigt JavaScript.</noscript>
</body>
</html>
